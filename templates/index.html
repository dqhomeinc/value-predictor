{% extends 'base.html' %}
{% block title %}Value Predictor{% endblock %}
{% block content %}
  <h1>Value Predictor</h1>
  <p>Signed in as {{ current_user.username }}.</p>

  <section>
    <form method="post" action="{{ url_for('main.analyses') }}" id="analyze-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Address
        <input type="text" name="address" value="{{ form_values.address if form_values else '' }}" required>
      </label>
      <label>Purchase price ($)
        <input type="number" name="purchase_price" min="0" step="1000"
               value="{{ form_values.purchase_price if form_values else '' }}" required>
      </label>
      <label>Rebuild cost per sq ft ($)
        <input type="number" name="cost_per_sqft" min="0" step="1"
               value="{{ form_values.cost_per_sqft if form_values else '' }}" required>
      </label>
      <label>Target profit margin (%)
        <input type="number" name="profit_margin_pct" step="0.1"
               value="{{ form_values.profit_margin_pct if form_values else '20' }}" required>
      </label>
      <button type="submit" id="analyze-submit">Analyze</button>
      <p id="analyze-loading" hidden>Analyzing property… this can take a few seconds.</p>
    </form>

    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Log out</button>
    </form>
  </section>

  <p class="page-nav"><a href="{{ url_for('main.analyses') }}">View past analyses</a></p>

  <script src="{{ url_for('static', filename='analyze-form.js') }}"></script>
{% endblock %}
