services:
  - type: web
    name: value-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt && FLASK_APP=wsgi:app flask db upgrade
    startCommand: gunicorn wsgi:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      # DATABASE_URL: set to your Postgres connection string.
      # RENTCAST_API_KEY and ANTHROPIC_API_KEY: set manually in the Render
      # dashboard after deployment (Dashboard -> value-predictor -> Environment).
