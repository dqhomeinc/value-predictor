services:
  - type: web
    name: value-predictor
    runtime: python
    # RENTCAST_API_KEY and ANTHROPIC_API_KEY are dashboard-only: set them
    # manually in the Render dashboard after deployment
    # (Dashboard -> value-predictor -> Environment), not in this file.
    buildCommand: pip install -r requirements.txt && FLASK_APP=wsgi:app flask db upgrade
    startCommand: gunicorn wsgi:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
        # Set to your Postgres connection string.
      - key: PYTHON_VERSION
        value: 3.11.0
